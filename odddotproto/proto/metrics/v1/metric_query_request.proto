syntax = "proto3";

package odddotnet.proto.metrics.v1;

import "odddotproto/proto/common/v1/common.proto";
import "odddotproto/proto/common/v1/filters.proto";
import "odddotproto/proto/common/v1/properties.proto";
import "odddotproto/proto/resource/v1/resource_filters.proto";
import "opentelemetry/proto/metrics/v1/metrics.proto";

option csharp_namespace = "OddDotNet.Proto.Metrics.V1";
option java_multiple_files = true;
option java_package = "io.odddotnet.proto.metrics.v1";
option java_outer_classname = "MetricQueryRequestProto";
option go_package = "go.odddotnet.io/proto/otlp/metrics/v1";

// MetricQueryRequest asks the sink for metrics matching filters, bounded by
// take and duration.
message MetricQueryRequest {
  // Filters a metric must satisfy to match. A metric must pass every filter
  // (logical AND); an empty list matches all metrics.
  repeated Where filters = 1;

  // How many matching metrics end the wait early. Defaults to TakeFirst. See Take.
  odddotnet.proto.common.v1.Take take = 2;

  // Maximum time to wait for matching metrics. Defaults to 30s. See Duration.
  optional odddotnet.proto.common.v1.Duration duration = 3;
}

// Where is one filter clause. Set exactly one field to choose what it matches;
// an unset Where matches nothing. A query ANDs its Where clauses together (see
// MetricQueryRequest.filters).
message Where {
  oneof value {
    // Match a field of the metric itself.
    PropertyFilter property = 1;
    // Match when ANY of the nested clauses matches (logical OR).
    OrFilter or = 2;
    // Match the metric's instrumentation scope.
    odddotnet.proto.common.v1.InstrumentationScopeFilter instrumentation_scope = 3;
    // Match the metric's resource.
    odddotnet.proto.resource.v1.ResourceFilter resource = 4;
    // Match the instrumentation scope's schema URL.
    odddotnet.proto.common.v1.StringProperty instrumentation_scope_schema_url = 5;
    // Match the resource's schema URL.
    odddotnet.proto.common.v1.StringProperty resource_schema_url = 6;
  }
}

// PropertyFilter matches a single field of the metric. Set exactly one field;
// an unset PropertyFilter matches nothing. Fields mirror the OpenTelemetry
// Metric.
//
// The gauge/sum/histogram/exponential_histogram/summary fields select on the
// metric's data type: each matches ONLY metrics carrying that data type (a
// gauge filter never matches a sum metric, and vice versa).
message PropertyFilter {
  reserved 4, 6, 8;
  oneof value {
    odddotnet.proto.common.v1.StringProperty name = 1;
    odddotnet.proto.common.v1.StringProperty description = 2;
    odddotnet.proto.common.v1.StringProperty unit = 3;
    GaugeFilter gauge = 5;
    SumFilter sum = 7;
    HistogramFilter histogram = 9;
    ExponentialHistogramFilter exponential_histogram = 10;
    SummaryFilter summary = 11;
    odddotnet.proto.common.v1.KeyValueListProperty metadata = 12;
  }
}

// GaugeFilter matches a gauge metric. Set exactly one field; an unset
// GaugeFilter matches nothing.
message GaugeFilter {
  oneof value {
    // Match when ANY of the gauge's data points satisfies the filter.
    NumberDataPointFilter data_point = 1;
  }
}

// SumFilter matches a sum metric. Set exactly one field; an unset SumFilter
// matches nothing.
message SumFilter {
  oneof value {
    // Match when ANY of the sum's data points satisfies the filter.
    NumberDataPointFilter data_point = 1;
    AggregationTemporalityProperty aggregation_temporality = 2;
    odddotnet.proto.common.v1.BoolProperty is_monotonic = 3;
  }
}

// HistogramFilter matches a histogram metric. Set exactly one field; an unset
// HistogramFilter matches nothing.
message HistogramFilter {
  oneof value {
    // Match when ANY of the histogram's data points satisfies the filter.
    HistogramDataPointFilter data_point = 1;
    AggregationTemporalityProperty aggregation_temporality = 2;
  }
}

// ExponentialHistogramFilter matches an exponential-histogram metric. Set
// exactly one field; an unset filter matches nothing.
message ExponentialHistogramFilter {
  oneof value {
    // Match when ANY of the data points satisfies the filter.
    ExponentialHistogramDataPointFilter data_point = 1;
    AggregationTemporalityProperty aggregation_temporality = 2;
  }
}

// SummaryFilter matches a summary metric. Set exactly one field; an unset
// SummaryFilter matches nothing.
message SummaryFilter {
  oneof value {
    // Match when ANY of the summary's data points satisfies the filter.
    SummaryDataPointFilter data_point = 1;
  }
}

// HistogramDataPointFilter matches one histogram data point. Set exactly one
// field; an unset filter matches nothing.
message HistogramDataPointFilter {
  reserved 1;
  oneof value {
    odddotnet.proto.common.v1.KeyValueListProperty attributes = 9;
    odddotnet.proto.common.v1.UInt64Property start_time_unix_nano = 2;
    odddotnet.proto.common.v1.UInt64Property time_unix_nano = 3;
    odddotnet.proto.common.v1.UInt64Property count = 4;
    odddotnet.proto.common.v1.DoubleProperty sum = 5;
    // Match when ANY of the point's per-bucket counts satisfies the filter.
    odddotnet.proto.common.v1.UInt64Property bucket_count = 6;
    // Match when ANY of the point's explicit bounds satisfies the filter.
    odddotnet.proto.common.v1.DoubleProperty explicit_bound = 7;
    // Match when ANY of the point's exemplars satisfies the filter.
    ExemplarFilter exemplar = 8;
    odddotnet.proto.common.v1.UInt32Property flags = 10;
    odddotnet.proto.common.v1.DoubleProperty min = 11;
    odddotnet.proto.common.v1.DoubleProperty max = 12;
  }
}

// ExponentialHistogramDataPointFilter matches one exponential-histogram data
// point. Set exactly one field; an unset filter matches nothing.
message ExponentialHistogramDataPointFilter {
  oneof value {
    odddotnet.proto.common.v1.KeyValueListProperty attributes = 1;
    odddotnet.proto.common.v1.UInt64Property start_time_unix_nano = 2;
    odddotnet.proto.common.v1.UInt64Property time_unix_nano = 3;
    odddotnet.proto.common.v1.UInt64Property count = 4;
    odddotnet.proto.common.v1.DoubleProperty sum = 5;
    odddotnet.proto.common.v1.Int32Property scale = 6;
    odddotnet.proto.common.v1.UInt64Property zero_count = 7;
    // Match when ANY bucket in the point's positive range satisfies the filter.
    BucketFilter positive = 8;
    // Match when ANY bucket in the point's negative range satisfies the filter.
    BucketFilter negative = 9;
    odddotnet.proto.common.v1.UInt32Property flags = 10;
    // Match when ANY of the point's exemplars satisfies the filter.
    ExemplarFilter exemplar = 11;
    odddotnet.proto.common.v1.DoubleProperty min = 12;
    odddotnet.proto.common.v1.DoubleProperty max = 13;
    odddotnet.proto.common.v1.DoubleProperty zero_threshold = 14;
  }
}

// BucketFilter matches the positive or negative buckets of an exponential
// histogram data point. Set exactly one field; an unset filter matches nothing.
message BucketFilter {
  oneof value {
    odddotnet.proto.common.v1.Int32Property offset = 1;
    // Match when ANY of the bucket counts satisfies the filter.
    odddotnet.proto.common.v1.UInt64Property bucket_count = 2;
  }
}

// NumberDataPointFilter matches one gauge or sum data point. Set exactly one
// field; an unset filter matches nothing.
message NumberDataPointFilter {
  reserved 1;
  oneof value {
    odddotnet.proto.common.v1.KeyValueListProperty attributes = 7;
    odddotnet.proto.common.v1.UInt64Property start_time_unix_nano = 2;
    odddotnet.proto.common.v1.UInt64Property time_unix_nano = 3;
    // Match the point's value when it is a double.
    odddotnet.proto.common.v1.DoubleProperty value_as_double = 4;
    // Match the point's value when it is an int.
    odddotnet.proto.common.v1.Int64Property value_as_int = 6;
    // Match when ANY of the point's exemplars satisfies the filter.
    ExemplarFilter exemplar = 5;
    odddotnet.proto.common.v1.UInt32Property flags = 8;
  }
}

// SummaryDataPointFilter matches one summary data point. Set exactly one field;
// an unset filter matches nothing.
message SummaryDataPointFilter {
  reserved 1;
  oneof value {
    odddotnet.proto.common.v1.KeyValueListProperty attributes = 7;
    odddotnet.proto.common.v1.UInt64Property start_time_unix_nano = 2;
    odddotnet.proto.common.v1.UInt64Property time_unix_nano = 3;
    odddotnet.proto.common.v1.UInt64Property count = 4;
    odddotnet.proto.common.v1.DoubleProperty sum = 5;
    // Match when ANY of the point's quantile values satisfies the filter.
    ValueAtQuantileFilter quantile_value = 6;
    odddotnet.proto.common.v1.UInt32Property flags = 8;
  }
}

// ExemplarFilter matches one exemplar attached to a data point. Set exactly one
// field; an unset filter matches nothing.
message ExemplarFilter {
  oneof value {
    odddotnet.proto.common.v1.KeyValueListProperty filtered_attributes = 1;
    odddotnet.proto.common.v1.UInt64Property time_unix_nano = 2;
    // Match the exemplar's value when it is a double.
    odddotnet.proto.common.v1.DoubleProperty value_as_double = 3;
    // Match the exemplar's value when it is an int.
    odddotnet.proto.common.v1.Int64Property value_as_int = 4;
    odddotnet.proto.common.v1.ByteStringProperty span_id = 5;
    odddotnet.proto.common.v1.ByteStringProperty trace_id = 6;
  }
}

// OrFilter matches when ANY of its nested Where clauses matches (logical OR),
// letting you express disjunctions inside the otherwise-AND filter list.
message OrFilter {
  repeated Where filters = 1;
}

// AggregationTemporalityProperty compares a metric's aggregation temporality
// against an OTLP AggregationTemporality via EQUALS / NOT_EQUALS. See
// EnumCompareAsType.
message AggregationTemporalityProperty {
  odddotnet.proto.common.v1.EnumCompareAsType compare_as = 1;
  opentelemetry.proto.metrics.v1.AggregationTemporality compare = 2;
}

// ValueAtQuantileFilter matches one (quantile, value) pair of a summary data
// point. Set exactly one field; an unset filter matches nothing.
message ValueAtQuantileFilter {
  oneof property {
    // Match the quantile (e.g. 0.99).
    odddotnet.proto.common.v1.DoubleProperty quantile = 1;
    // Match the value recorded at that quantile.
    odddotnet.proto.common.v1.DoubleProperty value = 2;
  }
}
