syntax = "proto3";

package odddotnet.proto.logs.v1;

import "opentelemetry/proto/common/v1/common.proto";
import "opentelemetry/proto/resource/v1/resource.proto";
import "opentelemetry/proto/logs/v1/logs.proto";

option csharp_namespace = "OddDotNet.Proto.Logs.V1";
option java_multiple_files = true;
option java_package = "io.odddotnet.proto.logs.v1";
option java_outer_classname = "FlatLogProto";
option go_package = "go.odddotnet.io/proto/otlp/logs/v1";

// FlatLog is one log record paired with the resource and instrumentation scope
// it arrived under — the unit every log query returns.
//
// OTLP nests logs (ResourceLogs -> ScopeLogs -> LogRecord) so context is not
// repeated on the wire; the sink flattens that hierarchy back onto each record
// so a single result carries everything needed to interpret it. The `log`,
// `resource`, and `instrumentation_scope` fields are the upstream OpenTelemetry
// messages — see the opentelemetry-proto docs for their contents; only the
// flattening and the two schema-url fields are added here.
message FlatLog {
  // The matched log record (upstream OTLP LogRecord).
  opentelemetry.proto.logs.v1.LogRecord log = 1;
  // Resource the log was reported under (upstream OTLP Resource).
  opentelemetry.proto.resource.v1.Resource resource = 2;
  // Instrumentation scope the log was reported under (upstream OTLP).
  opentelemetry.proto.common.v1.InstrumentationScope instrumentation_scope = 3;
  // Schema URL associated with the resource.
  string resource_schema_url = 4;
  // Schema URL associated with the instrumentation scope.
  string instrumentation_scope_schema_url = 5;
}
