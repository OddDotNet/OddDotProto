syntax = "proto3";

package odddotnet.proto.appinsights.v1.dependency;

import "odddotproto/proto/appinsights/v1/envelope_filters.proto";
import "odddotproto/proto/common/v1/common.proto";
import "odddotproto/proto/common/v1/properties.proto";

option csharp_namespace = "OddDotNet.Proto.AppInsights.V1.Dependency";
option java_multiple_files = true;
option java_package = "io.odddotnet.proto.appinsights.v1.dependency";
option java_outer_classname = "DependencyQueryRequestProto";
option go_package = "go.odddotnet.io/proto/appinsights/v1/dependency";

// DependencyQueryRequest asks the sink for dependency-call telemetry matching
// filters, bounded by take and duration. See common/v1/common.proto for the
// shared Take/Duration wait contract.
message DependencyQueryRequest {
  // Filters an item must satisfy to match. An item must pass every filter
  // (logical AND); an empty list matches all dependency items.
  repeated Where filters = 1;

  // How many matching items end the wait early. Defaults to TakeFirst. See Take.
  odddotnet.proto.common.v1.Take take = 2;

  // Maximum time to wait for matches. Defaults to 30s. See Duration.
  optional odddotnet.proto.common.v1.Duration duration = 3;
}

// Where is one filter clause. Set exactly one field; an unset Where matches
// nothing. A query ANDs its Where clauses together (see
// DependencyQueryRequest.filters).
message Where {
  oneof value {
    // Match a field of the dependency telemetry itself.
    PropertyFilter property = 1;
    // Match when ANY of the nested clauses matches (logical OR).
    OrFilter or = 2;
    // Match the shared telemetry envelope (key / time / context). See EnvelopeFilter.
    odddotnet.proto.appinsights.v1.EnvelopeFilter envelope = 3;
  }
}

// PropertyFilter matches a single field of the DependencyTelemetry. Set
// exactly one field; an unset PropertyFilter matches nothing.
message PropertyFilter {
  oneof value {
    odddotnet.proto.common.v1.StringProperty id = 1;
    odddotnet.proto.common.v1.StringProperty name = 2;
    odddotnet.proto.common.v1.StringProperty duration = 3;
    odddotnet.proto.common.v1.StringProperty result_code = 4;
    odddotnet.proto.common.v1.BoolProperty success = 5;
    odddotnet.proto.common.v1.StringProperty data = 6;
    odddotnet.proto.common.v1.StringProperty target = 7;
    odddotnet.proto.common.v1.StringProperty type = 8;
    // Match one entry of the custom string properties map. See PropertyMapProperty.
    odddotnet.proto.appinsights.v1.PropertyMapProperty properties = 9;
    // Match one entry of the custom numeric measurements map. See MeasurementMapProperty.
    odddotnet.proto.appinsights.v1.MeasurementMapProperty measurements = 10;
  }
}

// OrFilter matches when ANY of its nested Where clauses matches (logical OR),
// letting you express disjunctions inside the otherwise-AND filter list.
message OrFilter {
  repeated Where filters = 1;
}
