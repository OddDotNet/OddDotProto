syntax = "proto3";

package odddotnet.proto.appinsights.v1.trace;

import "odddotproto/proto/appinsights/v1/envelope_filters.proto";
import "odddotproto/proto/common/v1/common.proto";
import "odddotproto/proto/common/v1/properties.proto";

option csharp_namespace = "OddDotNet.Proto.AppInsights.V1.Trace";
option java_multiple_files = true;
option java_package = "io.odddotnet.proto.appinsights.v1.trace";
option java_outer_classname = "TraceQueryRequestProto";
option go_package = "go.odddotnet.io/proto/appinsights/v1/trace";

// TraceQueryRequest asks the sink for App Insights trace (log-message)
// telemetry matching filters, bounded by take and duration. See
// common/v1/common.proto for the shared Take/Duration wait contract.
message TraceQueryRequest {
  // Filters an item must satisfy to match. An item must pass every filter
  // (logical AND); an empty list matches all trace items.
  repeated Where filters = 1;

  // How many matching items end the wait early. Defaults to TakeFirst. See Take.
  odddotnet.proto.common.v1.Take take = 2;

  // Maximum time to wait for matches. Defaults to 30s. See Duration.
  optional odddotnet.proto.common.v1.Duration duration = 3;
}

// Where is one filter clause. Set exactly one field; an unset Where matches
// nothing. A query ANDs its Where clauses together (see TraceQueryRequest.filters).
message Where {
  oneof value {
    // Match a field of the trace telemetry itself.
    PropertyFilter property = 1;
    // Match when ANY of the nested clauses matches (logical OR).
    OrFilter or = 2;
    // Match the shared telemetry envelope (key / time / context). See EnvelopeFilter.
    odddotnet.proto.appinsights.v1.EnvelopeFilter envelope = 3;
  }
}

// PropertyFilter matches a single field of the TraceTelemetry. Set exactly one
// field; an unset PropertyFilter matches nothing.
message PropertyFilter {
  oneof value {
    odddotnet.proto.common.v1.StringProperty message = 1;
    // Match the trace's severity level. See SeverityLevelProperty.
    odddotnet.proto.appinsights.v1.SeverityLevelProperty severity_level = 2;
    // Match one entry of the custom string properties map. See PropertyMapProperty.
    odddotnet.proto.appinsights.v1.PropertyMapProperty properties = 3;
  }
}

// OrFilter matches when ANY of its nested Where clauses matches (logical OR),
// letting you express disjunctions inside the otherwise-AND filter list.
message OrFilter {
  repeated Where filters = 1;
}
