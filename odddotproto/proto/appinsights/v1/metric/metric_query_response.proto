syntax = "proto3";

package odddotnet.proto.appinsights.v1.metric;

import "odddotproto/proto/appinsights/v1/metric/flat_metric.proto";

option csharp_namespace = "OddDotNet.Proto.AppInsights.V1.Metric";
option java_multiple_files = true;
option java_package = "io.odddotnet.proto.appinsights.v1.metric";
option java_outer_classname = "MetricQueryResponseProto";
option go_package = "go.odddotnet.io/proto/appinsights/v1/metric";

// MetricQueryResponse is the unary Query reply: every metric item that matched.
// Empty when the wait ended with no match. StreamQuery streams the FlatMetric
// items individually instead.
message MetricQueryResponse {
  repeated FlatMetric metrics = 1;
}
