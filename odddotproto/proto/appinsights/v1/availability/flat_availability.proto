syntax = "proto3";

package odddotnet.proto.appinsights.v1.availability;

import "odddotproto/proto/appinsights/v1/common.proto";
import "odddotproto/proto/appinsights/v1/telemetry_types.proto";

option csharp_namespace = "OddDotNet.Proto.AppInsights.V1.Availability";
option java_multiple_files = true;
option java_package = "io.odddotnet.proto.appinsights.v1.availability";
option java_outer_classname = "FlatAvailabilityProto";
option go_package = "go.odddotnet.io/proto/appinsights/v1/availability";

// FlatAvailability is one availability-test telemetry item paired with the
// envelope it arrived under — the unit every availability query returns.
message FlatAvailability {
  // The matched availability telemetry.
  odddotnet.proto.appinsights.v1.AvailabilityTelemetry availability = 1;
  // The shared telemetry envelope (instrumentation key, time, context).
  odddotnet.proto.appinsights.v1.TelemetryEnvelope envelope = 2;
}
