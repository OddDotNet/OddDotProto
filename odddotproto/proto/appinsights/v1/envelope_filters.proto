syntax = "proto3";

package odddotnet.proto.appinsights.v1;

import "odddotproto/proto/appinsights/v1/common.proto";
import "odddotproto/proto/common/v1/properties.proto";

option csharp_namespace = "OddDotNet.Proto.AppInsights.V1";
option java_multiple_files = true;
option java_package = "io.odddotnet.proto.appinsights.v1";
option java_outer_classname = "EnvelopeFiltersProto";
option go_package = "go.odddotnet.io/proto/appinsights/v1";

// ============================================================================
// Common envelope/context filters shared by all telemetry types
// ============================================================================
//
// Every App Insights telemetry item carries a TelemetryEnvelope (see
// common.proto): the instrumentation key, timestamp, and a TelemetryContext of
// nested context objects. These filters let a query match on that shared
// envelope regardless of the item's telemetry type. Each filter here is a
// oneof: set exactly one field, and an unset filter matches nothing. String
// fields use StringProperty semantics (see properties.proto).

// EnvelopeFilter matches the telemetry envelope. Set exactly one field.
message EnvelopeFilter {
  oneof value {
    // Match the instrumentation key.
    odddotnet.proto.common.v1.StringProperty instrumentation_key = 1;
    // Match the ISO-8601 creation timestamp (compared as a string).
    odddotnet.proto.common.v1.StringProperty time = 2;
    // Match a field of the telemetry context.
    ContextFilter context = 3;
  }
}

// ContextFilter matches one of the envelope's context objects. Set exactly one
// field; the chosen sub-filter then selects which of that object's fields to
// match.
message ContextFilter {
  oneof value {
    OperationContextFilter operation = 1;
    CloudContextFilter cloud = 2;
    DeviceContextFilter device = 3;
    UserContextFilter user = 4;
    SessionContextFilter session = 5;
    LocationContextFilter location = 6;
    ApplicationContextFilter application = 7;
    InternalContextFilter internal = 8;
  }
}

// OperationContextFilter matches one field of the operation context. Set
// exactly one field.
message OperationContextFilter {
  oneof value {
    odddotnet.proto.common.v1.StringProperty id = 1;
    odddotnet.proto.common.v1.StringProperty parent_id = 2;
    odddotnet.proto.common.v1.StringProperty name = 3;
    odddotnet.proto.common.v1.StringProperty synthetic_source = 4;
    odddotnet.proto.common.v1.StringProperty correlation_vector = 5;
  }
}

// CloudContextFilter matches one field of the cloud context. Set exactly one
// field.
message CloudContextFilter {
  oneof value {
    odddotnet.proto.common.v1.StringProperty role_name = 1;
    odddotnet.proto.common.v1.StringProperty role_instance = 2;
  }
}

// DeviceContextFilter matches one field of the device context. Set exactly one
// field.
message DeviceContextFilter {
  oneof value {
    odddotnet.proto.common.v1.StringProperty id = 1;
    odddotnet.proto.common.v1.StringProperty type = 2;
    odddotnet.proto.common.v1.StringProperty os_version = 3;
  }
}

// UserContextFilter matches one field of the user context. Set exactly one
// field.
message UserContextFilter {
  oneof value {
    odddotnet.proto.common.v1.StringProperty id = 1;
    odddotnet.proto.common.v1.StringProperty authenticated_id = 2;
    odddotnet.proto.common.v1.StringProperty account_id = 3;
  }
}

// SessionContextFilter matches one field of the session context. Set exactly
// one field.
message SessionContextFilter {
  oneof value {
    odddotnet.proto.common.v1.StringProperty id = 1;
    odddotnet.proto.common.v1.BoolProperty is_first = 2;
  }
}

// LocationContextFilter matches one field of the location context. Set exactly
// one field.
message LocationContextFilter {
  oneof value {
    odddotnet.proto.common.v1.StringProperty ip = 1;
    odddotnet.proto.common.v1.StringProperty country = 2;
    odddotnet.proto.common.v1.StringProperty province = 3;
    odddotnet.proto.common.v1.StringProperty city = 4;
  }
}

// ApplicationContextFilter matches the application context. Set exactly one
// field.
message ApplicationContextFilter {
  oneof value {
    odddotnet.proto.common.v1.StringProperty version = 1;
  }
}

// InternalContextFilter matches one field of the internal SDK context. Set
// exactly one field.
message InternalContextFilter {
  oneof value {
    odddotnet.proto.common.v1.StringProperty sdk_version = 1;
    odddotnet.proto.common.v1.StringProperty agent_version = 2;
    odddotnet.proto.common.v1.StringProperty node_name = 3;
  }
}

// PropertyMapProperty matches one entry of a telemetry item's custom string
// `properties` map: the entry keyed by `key` must exist AND its value must
// satisfy `value` (StringProperty). A missing key does not match.
message PropertyMapProperty {
  // Map key to look up. Must be present for the filter to match.
  string key = 1;
  // StringProperty comparison applied to the entry's value.
  odddotnet.proto.common.v1.StringProperty value = 2;
}

// MeasurementMapProperty matches one entry of a telemetry item's custom numeric
// `measurements` map: the entry keyed by `key` must exist AND its value must
// satisfy `value` (DoubleProperty). A missing key does not match.
message MeasurementMapProperty {
  // Map key to look up. Must be present for the filter to match.
  string key = 1;
  // DoubleProperty comparison applied to the entry's value.
  odddotnet.proto.common.v1.DoubleProperty value = 2;
}

// SeverityLevelProperty compares a telemetry item's severity level against a
// SeverityLevel via EQUALS / NOT_EQUALS. Used by Exception and Trace. See
// EnumCompareAsType.
message SeverityLevelProperty {
  odddotnet.proto.common.v1.EnumCompareAsType compare_as = 1;
  SeverityLevel compare = 2;
}
